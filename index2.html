<!DOCTYPE html>
<html>
<head>

<title>Salesforce Switch</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f4f7fc;
}

header{
background:#2563eb;
color:white;
padding:15px;
text-align:center;
}

.container{
width:90%;
margin:auto;
padding:20px;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}

.tabs button{
padding:10px 20px;
border:none;
background:#ddd;
cursor:pointer;
}

.tabs button.active{
background:#2563eb;
color:white;
}

.tab{
display:none;
background:white;
padding:20px;
border-radius:10px;
}

.tab.active{
display:block;
}

.row{
display:flex;
justify-content:space-between;
padding:15px;
border-bottom:1px solid #eee;
}

.actions{
margin-top:20px;
}

.actions button{
padding:10px 20px;
margin-right:10px;
border:none;
cursor:pointer;
color:white;
}

.enable{
background:green;
}

.disable{
background:red;
}

.deploy{
background:#2563eb;
}

.switch{
position:relative;
display:inline-block;
width:60px;
height:34px;
}

.switch input{
opacity:0;
width:0;
height:0;
}

.slider{
position:absolute;
cursor:pointer;
top:0;
left:0;
right:0;
bottom:0;
background-color:#ccc;
transition:.4s;
border-radius:34px;
}

.slider:before{
position:absolute;
content:"";
height:26px;
width:26px;
left:4px;
bottom:4px;
background:white;
transition:.4s;
border-radius:50%;
}

input:checked + .slider{
background:#22c55e;
}

input:checked + .slider:before{
transform:translateX(26px);
}

</style>

</head>

<body>

<header>
<h1>Salesforce Switch Toolkit</h1>
</header>

<div class="container">

<div class="tabs">

<button class="active"
onclick="showTab('v',this)">
Validation
</button>

<button
onclick="showTab('w',this)">
Workflow
</button>

<button
onclick="showTab('t',this)">
Triggers
</button>

</div>

<div id="v" class="tab active">

<div class="row">
<span>Email Validation</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<div class="row">
<span>Phone Validation</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

</div>

<div id="w" class="tab">

<div class="row">
<span>Lead Workflow</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<div class="row">
<span>Customer Workflow</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

</div>

<div id="t" class="tab">

<div class="row">
<span>Account Trigger</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<div class="row">
<span>Contact Trigger</span>

<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

</div>

<div class="actions">

<button class="enable"
onclick="enableAll()">
Enable All
</button>

<button class="disable"
onclick="disableAll()">
Disable All
</button>

<button class="deploy"
onclick="deployChanges()">
Deploy Changes
</button>

</div>

</div>

<script>

function showTab(id,btn){

document
.querySelectorAll('.tab')
.forEach(tab=>{
tab.classList.remove('active');
});

document
.querySelectorAll('.tabs button')
.forEach(button=>{
button.classList.remove('active');
});

document
.getElementById(id)
.classList.add('active');

btn.classList.add('active');

}

function enableAll(){

document
.querySelectorAll('input[type=checkbox]')
.forEach(cb=>{
cb.checked=true;
});

}

function disableAll(){

document
.querySelectorAll('input[type=checkbox]')
.forEach(cb=>{
cb.checked=false;
});

}

function deployChanges(){

alert("Changes Deployed Successfully");

}

</script>

</body>
</html>
