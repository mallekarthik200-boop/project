<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salesforce Switch Toolkit</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

/* LOGIN PAGE */



#loginPage{
height:100vh;
display:flex;
justify-content:right;
align-items:center;

background-image:url('/media/salesforce1.png');
background-size:cover;
background-position:right;
background-repeat:no-repeat;


}

.login-card{
width:500px;
background:rgba(255,255,255,0.92);
padding:50px;
border-radius:35px;
box-shadow:0 10px 40px rgba(0,0,0,0.2);
backdrop-filter:blur(5px);
}

.login-card h2{
text-align:center;
font-size:24px;
color:#16325c;
margin-bottom:10px;
}

.login-card p{
text-align:center;
color:#54698d;
margin-bottom:30px;
}

.login-card label{
display:block;
font-weight:bold;
margin-bottom:8px;
color:#16325c;
}

.login-card input[type=text],
.login-card input[type=password]{
width:100%;
padding:16px;
border:1px solid #d8dde6;
border-radius:12px;
font-size:16px;
margin-bottom:25px;
background:#f8f9fb;
}

.options{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.options a{
text-decoration:none;
color:#0176d3;
}

.login-btn{
width:100%;
padding:16px;
background:#0176d3;
color:white;
border:none;
border-radius:12px;
font-size:20px;
cursor:pointer;
}

.divider{
text-align:center;
margin:25px 0;
font-size:20px;
color:#666;
}

.salesforce-btn{
width:100%;
padding:16px;
background:white;
border:2px solid #0176d3;
border-radius:12px;
color:#0176d3;
font-size:18px;
cursor:pointer;
}

.footer{
text-align:center;
margin-top:30px;
color:#54698d;
line-height:1.6;
}

#error{
color:red;
text-align:center;
margin-top:10px;
}

/* TOOLKIT */

#toolkitPage{
display:none;
background:#f4f7fc;
min-height:100vh;
}

header{
background:#2563eb;
color:white;
padding:15px;
text-align:center;
}

.container{
width:90%;
margin:auto;
padding:20px;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}

.tabs button{
padding:10px 20px;
border:none;
background:#ddd;
cursor:pointer;
}

.tabs button.active{
background:#2563eb;
color:white;
}

.tab{
display:none;
background:white;
padding:20px;
border-radius:10px;
}

.tab.active{
display:block;
}

.row{
display:flex;
justify-content:space-between;
padding:15px;
border-bottom:1px solid #eee;
}

.actions{
margin-top:20px;
}

.actions button{
padding:10px 20px;
margin-right:10px;
border:none;
cursor:pointer;
color:white;
}

.enable{
background:green;
}

.disable{
background:red;
}

.deploy{
background:#2563eb;
}

.switch{
position:relative;
display:inline-block;
width:60px;
height:34px;
}

.switch input{
opacity:0;
width:0;
height:0;
}

.slider{
position:absolute;
cursor:pointer;
top:0;
left:0;
right:0;
bottom:0;
background:#ccc;
transition:.4s;
border-radius:34px;
}

.slider:before{
position:absolute;
content:"";
height:26px;
width:26px;
left:4px;
bottom:4px;
background:white;
transition:.4s;
border-radius:50%;
}

input:checked + .slider{
background:#22c55e;
}

input:checked + .slider:before{
transform:translateX(26px);
}

</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div id="loginPage">

<div class="login-card">

<h2>Login to Your Account</h2>

<p>Access your Salesforce Switch Toolkit</p>

<label>Username</label>

<input type="text"
id="username"
placeholder="Enter your username">

<label>Password</label>

<input type="password"
id="password"
placeholder="Enter your password">

<div class="options">

<label style="font-weight:normal;">
<input type="checkbox" style="width:auto;">
Remember me
</label>

<a href="#" onclick="forgotPassword()">
Forgot Password?
</a>

</div>

<button class="login-btn"
onclick="login()">
Login
</button>

<div class="divider">
OR
</div>

<button class="salesforce-btn">
Login with Salesforce
</button>

<div class="footer">
New to Salesforce Switch?<br>
Contact your administrator for access.
</div>

<p id="error"></p>

</div>

</div>

</div>

<!-- TOOLKIT PAGE -->

<div id="toolkitPage">

<header>
<h1>Salesforce Switch Toolkit</h1>
</header>

<div class="container">

<div class="tabs">

<button class="active"
onclick="showTab('v',this)">
Validation
</button>

<button onclick="showTab('w',this)">
Workflow
</button>

<button onclick="showTab('t',this)">
Triggers
</button>

</div>

<div id="v" class="tab active">

<div class="row">
<span>Email Validation</span>
<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

<div class="row">
<span>Phone Validation</span>
<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

</div>

<div id="w" class="tab">

<div class="row">
<span>Lead Workflow</span>
<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

</div>

<div id="t" class="tab">

<div class="row">
<span>Account Trigger</span>
<label class="switch">
<input type="checkbox">
<span class="slider"></span>
</label>
</div>

</div>

<div class="actions">

<button class="enable"
onclick="enableAll()">
Enable All
</button>

<button class="disable"
onclick="disableAll()">
Disable All
</button>

<button class="deploy"
onclick="deployChanges()">
Deploy Changes
</button>

</div>

</div>

</div>

<script>

/* LOGIN USERS */

const users = [
{
username:"admin",
password:"admin123"
},
{
username:"karthik",
password:"karthik123"
}
];

function login(){

let username =
document.getElementById("username").value;

let password =
document.getElementById("password").value;

let validUser =
users.find(user =>
user.username === username &&
user.password === password
);

if(validUser){

document.getElementById("loginPage").style.display="none";
document.getElementById("toolkitPage").style.display="block";

history.pushState(
{page:"toolkit"},
"",
"#toolkit"
);

history.pushState(
{page:"toolkit"},
"",
"#toolkit"
);

}
else{

document.getElementById("error").innerHTML =
"Invalid Username or Password";

}
function logout(){

history.back();

}


}

/* TOOLKIT FUNCTIONS */

function showTab(id,btn){

document.querySelectorAll('.tab')
.forEach(tab=>{
tab.classList.remove('active');
});

document.querySelectorAll('.tabs button')
.forEach(button=>{
button.classList.remove('active');
});

document.getElementById(id)
.classList.add('active');

btn.classList.add('active');

}

function enableAll(){

document.querySelectorAll(
'input[type=checkbox]'
).forEach(cb=>{
cb.checked=true;
});

}

function disableAll(){

document.querySelectorAll(
'input[type=checkbox]'
).forEach(cb=>{
cb.checked=false;
});

}

function deployChanges(){

alert("Changes Deployed Successfully");

}

</script>

</body>
</html>
