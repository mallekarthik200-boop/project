<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salesforce Switch Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:90vh;
display:flex;
justify-content:flex-end;
align-items:center;
padding-right:80px;

background-image:url('/media/salesforce1.png');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

.login-card{
width:400px;
background:rgba(255,255,255,0.95);
padding:40px;
border-radius:30px;
box-shadow:0 10px 40px rgba(0,0,0,0.2);
}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo img{
width:100px;
}

.logo h2{
margin-top:15px;
color:#16325c;
}

.logo p{
color:#54698d;
}

.form-group{
margin-top:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
color:#16325c;
}

input{
width:100%;
padding:14px;
border:1px solid #d8dde6;
border-radius:10px;
font-size:16px;
}

.options{
display:flex;
justify-content:space-between;
margin-top:15px;
font-size:14px;
}

.options a{
text-decoration:none;
color:#0176d3;
}

.login-btn{
width:100%;
padding:15px;
margin-top:20px;
background:#0176d3;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

.login-btn:hover{
background:#005fb2;
}

.divider{
text-align:center;
margin:25px 0;
color:#666;
}

.salesforce-btn{
width:100%;
padding:15px;
background:white;
border:2px solid #0176d3;
color:#0176d3;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

.footer{
text-align:center;
margin-top:20px;
color:#54698d;
font-size:14px;
}

#error{
margin-top:15px;
color:red;
text-align:center;
}

@media(max-width:768px){

body{
justify-content:center;
padding:20px;
}

.login-card{
width:100%;
max-width:450px;
}

}

</style>
</head>

<body>

<div class="login-card">

<div class="logo">

<h2>Login to Your Account</h2>
<p>Access your Salesforce Switch Toolkit</p>

</div>

<div class="form-group">
<label>Username</label>
<input type="text" id="username"
placeholder="Enter your username">
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password"
placeholder="Enter your password">
</div>

<div class="options">
<label>
<input type="checkbox" style="width:auto;">
 Remember me
</label>

<a href="#" onclick="forgotPassword()">
Forgot Password?
</a>
</div>

<button class="login-btn"
onclick="login()">
Login
</button>

<div class="divider">OR</div>

<button class="salesforce-btn">
Login with Salesforce
</button>

<div class="footer">
New to Salesforce Switch?<br>
Contact your administrator for access.
</div>

<p id="error"></p>

</div>

<script>

const users = [
{
username:"admin",
password:"admin123"
},
{
username:"karthik",
password:"karthik123"
}
];

function login(){

let username =
document.getElementById("username").value;

let password =
document.getElementById("password").value;

let validUser = users.find(user =>
user.username === username &&
user.password === password
);

if(validUser){

window.location.href="index.html";

}
else{

document.getElementById("error")
.innerHTML="Invalid Username or Password";

}

}

</script>

</body>
</html>
